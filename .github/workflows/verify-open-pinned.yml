name: Verify Open release build - timestamp-pinned control

# Control experiment for the earlier "Verify Open release build from source" run.
# That run reproduced the released Open.apk with 960/962 zip entries byte-identical;
# the only content difference in classes.dex was BuildInfo.BUILD_DATE, which
# compose-launcher/prepare-development-inputs.sh fills from `date '+%Y-%m-%d %H:%M'`.
#
# Here the build clock is pinned to the timestamp embedded in the official APK
# (2026-09-21 10:34).  If classes.dex then becomes byte-identical, the public
# source is a byte-exact reproduction of the released artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1.7.5.1
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install Android platform 37 and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          [ -d "$ANDROID_SDK_ROOT/platforms/android-37" ] || \
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
      - name: Install Gradle 9.7.1
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-9.7.1/bin" >> "$GITHUB_PATH"
      - name: Apply the three undocumented fixes and pin the build clock
        run: |
          set -x
          cd compose-launcher
          # 1. gradle.properties hardcodes a Termux aapt2 path.
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          # 2. editions/closed/full-backup-src is referenced unconditionally but absent.
          mkdir -p ../editions/closed/full-backup-src
          # 3. module/debug.keystore is gitignored and never generated by the Gradle path.
          keytool -genkeypair -keystore ../module/debug.keystore -storepass android \
            -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000
          # 4. control: pin BUILD_DATE to the value embedded in the official Open.apk.
          grep -n "BUILD_DATE" prepare-development-inputs.sh
          sed -i "s|\$(date '+%Y-%m-%d %H:%M')|2026-09-21 10:34|" prepare-development-inputs.sh
          grep -n "BUILD_DATE" prepare-development-inputs.sh
      - name: Build Open release
        run: |
          cd compose-launcher
          gradle :app:assembleRelease -PprotectedBuild=false -PlocalApiIncluded=false \
            --no-daemon --stacktrace 2>&1 | tail -30
          find app/build/outputs -name '*.apk' -exec ls -l {} \;
      - name: Compare with the official Open.apk
        run: |
          set -x
          curl -sSL -o /tmp/official.apk \
            https://github.com/lllucccian/Deekseep/releases/download/v1.7.5.1/Open.apk
          built=$(find "$GITHUB_WORKSPACE/compose-launcher/app/build/outputs" -name '*.apk' | head -1)
          ls -l /tmp/official.apk "$built"
          mkdir -p /tmp/o /tmp/b
          ( cd /tmp/o && unzip -o -q /tmp/official.apk classes.dex )
          ( cd /tmp/b && unzip -o -q "$built" classes.dex )
          sha256sum /tmp/o/classes.dex /tmp/b/classes.dex
          if cmp -s /tmp/o/classes.dex /tmp/b/classes.dex; then
            echo "RESULT: classes.dex is BYTE-IDENTICAL to the released Open.apk"
          else
            echo "RESULT: classes.dex still differs"
            cmp -l /tmp/o/classes.dex /tmp/b/classes.dex | head -20
          fi
      - name: Full archive entry comparison
        run: |
          built=$(find "$GITHUB_WORKSPACE/compose-launcher/app/build/outputs" -name '*.apk' | head -1)
          python3 - "$built" <<'PY'
          import sys, zipfile, hashlib
          built = sys.argv[1]
          a = zipfile.ZipFile('/tmp/official.apk')
          b = zipfile.ZipFile(built)
          na = {i.filename: i for i in a.infolist()}
          nb = {i.filename: i for i in b.infolist()}
          print('entries official=%d built=%d' % (len(na), len(nb)))
          print('only official:', sorted(set(na) - set(nb)))
          print('only built   :', sorted(set(nb) - set(na)))
          same = diff = 0
          for n in sorted(set(na) & set(nb)):
              if hashlib.sha256(a.read(n)).digest() == hashlib.sha256(b.read(n)).digest():
                  same += 1
              else:
                  diff += 1
                  print('DIFF', n, na[n].file_size, nb[n].file_size)
          print('identical entries: %d  differing: %d' % (same, diff))
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pinned-rebuild
          path: |
            /tmp/o/classes.dex
            /tmp/b/classes.dex
          if-no-files-found: warn
          retention-days: 7
