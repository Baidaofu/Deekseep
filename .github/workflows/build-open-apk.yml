name: Build Open.apk (working recipe)

# 一键构建 Release 里那个成品 Open.apk。
#
# 为什么要单独写一个 workflow：
#   仓库自带的 build.yml 跑的是 scripts/build-all.sh（手写 javac/d8/aapt2 流水线），
#   产出的是另一个 2.1MB 的 APK，而且它在发布对应的 commit 上本来就失败。
#   真正产出 Release 成品的是仓库里没有文档的 Gradle 子项目 compose-launcher/。
#
# 下面 4 处是 compose-launcher 按仓库原样跑不起来的坑，已在本 workflow 里补齐：
#   1. gradle.properties 硬编码了 Termux 路径的 aapt2 override
#   2. module/debug.keystore 被 gitignore，Gradle 不会自己生成
#   3. protectedBuild 默认 true（闭源），必须显式关掉；另有一个仓库里不存在的源码目录要补空
#   4. AGP 9.3.0 的 lint 需要 JDK 21（文档写的是 17）

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的 git ref（v1.7.5.1 是 Release 对应的源码）
        required: false
        default: v1.7.5.1

permissions:
  contents: read

jobs:
  build-open-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'v1.7.5.1' }}
          fetch-depth: 0

      - name: Show what is being built
        run: git log -1 --format='%H %ad %s' --date=iso

      # 坑 4：AGP 9.3.0 的 lint 需要 JDK 21
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37 and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          # AGP 按 compileSdk 37 去找 platforms/android-37
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Install Gradle 9.7.1
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-9.7.1/bin" >> "$GITHUB_PATH"

      - name: Apply the four fixes
        run: |
          cd compose-launcher
          # 坑 1：去掉硬编码的 Termux aapt2 路径
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          # 坑 3a：build.gradle.kts 无条件引用了这个仓库里不存在的目录
          mkdir -p ../editions/closed/full-backup-src
          # 坑 2：生成被 gitignore 的签名 keystore
          keytool -genkeypair -keystore ../module/debug.keystore -storepass android \
            -keypass android -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      # 坑 3b：-PprotectedBuild=false 才是 Open 版（默认是闭源版，会直接失败）
      - name: Build Open.apk
        run: |
          cd compose-launcher
          gradle :app:assembleRelease -PprotectedBuild=false --no-daemon

      - name: Show result
        run: |
          find compose-launcher/app/build/outputs -name '*.apk' -exec ls -l {} \;
          find compose-launcher/app/build/outputs -name '*.apk' -exec sha256sum {} \;

      - name: Upload Open.apk
        uses: actions/upload-artifact@v7
        with:
          name: Open-apk
          path: compose-launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
