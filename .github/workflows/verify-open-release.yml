name: Verify Open release build from source

# Dispatched by the verification harness.  Goal: determine whether the public
# repository can reproduce the Open.apk published in GitHub Releases.
#
#   * build.yml (the repo's own CI) only runs scripts/build-all.sh, a hand-rolled
#     aapt2+javac+d8 build that shares no pipeline with the released APK.
#   * compose-launcher/ is the only thing in the repo whose build parameters
#     match the released APK (compileSdk 37, versionCode 35, versionName 1.7.5,
#     Compose, R8 -dontobfuscate for Open).  It is undocumented and never
#     exercised by CI.
#
# Stage 1 (JDK 17) records the blockers of the repo as published.
# Stage 2 (JDK 21) applies the minimum local deviations and tries to finish.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (tag v1.7.5.1 is the released source)
        required: false
        default: v1.7.5.1

permissions:
  contents: read

jobs:
  gradle-open-jdk17:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'v1.7.5.1' }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android platform 37 and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          [ -d "$ANDROID_SDK_ROOT/platforms/android-37" ] || \
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
      - name: Install Gradle 9.7.1
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-9.7.1/bin" >> "$GITHUB_PATH"
      - name: Repository facts
        run: |
          set +e
          git log -1 --format='%H %ad %s' --date=iso; git describe --tags --always
          grep -n aapt2FromMavenOverride compose-launcher/gradle.properties
          for p in editions/closed/full-backup-src module-universal/protected-payload-src \
                   third_party/shi-native/android third_party/shi-v5-v241/android \
                   compose-launcher/prepare-protected-inputs.sh \
                   compose-launcher/compile-protected-payload.sh \
                   compose-launcher/app/proguard-protected-rules.pro \
                   .private/closed/release-signing.properties \
                   module-universal/assets/rickroll_241.mp4 ; do
            [ -e "$p" ] && echo "PRESENT  $p" || echo "MISSING  $p"
          done
      - name: Attempt A - verbatim, Open, JDK 17
        continue-on-error: true
        run: |
          cd compose-launcher; set +e
          gradle :app:assembleRelease -PprotectedBuild=false --no-daemon --stacktrace \
            2>&1 | tee /tmp/attemptA.log | tail -30
          echo "exit=${PIPESTATUS[0]}"
      - name: Attempt C - + drop Termux aapt2 override, stub absent dir, generate keystore
        continue-on-error: true
        run: |
          cd compose-launcher; set +e
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          mkdir -p ../editions/closed/full-backup-src
          keytool -genkeypair -keystore ../module/debug.keystore -storepass android \
            -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000
          gradle :app:assembleRelease -PprotectedBuild=false -PlocalApiIncluded=false \
            --no-daemon --stacktrace 2>&1 | tee /tmp/attemptC.log | tail -30
          echo "exit=${PIPESTATUS[0]}"
          find app/build/outputs -name '*.apk' -exec ls -l {} \; || true
      - name: Collect stage 1
        if: always()
        run: |
          mkdir -p /tmp/out
          cp /tmp/attemptA.log /tmp/attemptC.log /tmp/out/ 2>/dev/null || true
          find compose-launcher/app/build/outputs -name '*.apk' -exec cp {} /tmp/out/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage1-jdk17
          path: /tmp/out/
          if-no-files-found: warn
          retention-days: 7

  gradle-open-jdk21:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'v1.7.5.1' }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install Android platform 37 and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          [ -d "$ANDROID_SDK_ROOT/platforms/android-37" ] || \
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
      - name: Install Gradle 9.7.1
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-9.7.1/bin" >> "$GITHUB_PATH"
      - name: Attempt E - Open release build, JDK 21, minimum local deviations
        continue-on-error: true
        run: |
          cd compose-launcher; set +e
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          mkdir -p ../editions/closed/full-backup-src
          keytool -genkeypair -keystore ../module/debug.keystore -storepass android \
            -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000
          gradle :app:assembleRelease -PprotectedBuild=false -PlocalApiIncluded=false \
            --no-daemon --stacktrace 2>&1 | tee /tmp/attemptE.log | tail -40
          echo "exit=${PIPESTATUS[0]}"
          find app/build/outputs -name '*.apk' -exec ls -l {} \; || true
      - name: Attempt F - as E plus -x lintVitalAnalyzeRelease
        continue-on-error: true
        run: |
          cd compose-launcher; set +e
          if ! ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            gradle :app:assembleRelease -PprotectedBuild=false -PlocalApiIncluded=false \
              -x lintVitalAnalyzeRelease --no-daemon --stacktrace \
              2>&1 | tee /tmp/attemptF.log | tail -40
            echo "exit=${PIPESTATUS[0]}"
          fi
          find app/build/outputs -name '*.apk' -exec ls -l {} \; || true
      - name: Compare built APK against the official released Open.apk
        if: always()
        continue-on-error: true
        run: |
          set +e
          curl -sSL -o /tmp/official-Open.apk \
            https://github.com/lllucccian/Deekseep/releases/download/v1.7.5.1/Open.apk
          ls -l /tmp/official-Open.apk; sha256sum /tmp/official-Open.apk
          mkdir -p /tmp/cmp/x /tmp/cmp/y
          ( cd /tmp/cmp/y && unzip -o -q /tmp/official-Open.apk classes.dex )
          dexdump /tmp/cmp/y/classes.dex 2>/dev/null | grep -E "^  Class descriptor" \
            | sed "s/.*: '//;s/'.*//" | sort > /tmp/cmp/official.txt
          for apk in $(find "$GITHUB_WORKSPACE/compose-launcher/app/build/outputs" -name '*.apk'); do
            b=$(basename "$apk"); echo "### $b"; ls -l "$apk"; sha256sum "$apk"
            ( cd /tmp/cmp/x && rm -f classes.dex && unzip -o -q "$apk" classes.dex )
            dexdump /tmp/cmp/x/classes.dex 2>/dev/null | grep -E "^  Class descriptor" \
              | sed "s/.*: '//;s/'.*//" | sort > "/tmp/cmp/$b.txt"
            echo "classes: built=$(wc -l < "/tmp/cmp/$b.txt") official=$(wc -l < /tmp/cmp/official.txt)"
            echo "only-in-official=$(comm -23 /tmp/cmp/official.txt "/tmp/cmp/$b.txt" | wc -l)"
            echo "only-in-built=$(comm -13 /tmp/cmp/official.txt "/tmp/cmp/$b.txt" | wc -l)"
            echo "--- com.dsmod only in official:"; comm -23 /tmp/cmp/official.txt "/tmp/cmp/$b.txt" | grep '^Lcom/dsmod' | head -30
            echo "--- com.dsmod only in built:";    comm -13 /tmp/cmp/official.txt "/tmp/cmp/$b.txt" | grep '^Lcom/dsmod' | head -30
          done
      - name: Collect stage 2
        if: always()
        run: |
          mkdir -p /tmp/out2
          cp /tmp/attemptE.log /tmp/attemptF.log /tmp/out2/ 2>/dev/null || true
          find compose-launcher/app/build/outputs -name '*.apk' -exec cp {} /tmp/out2/ \; 2>/dev/null || true
          ls -l /tmp/out2 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage2-jdk21
          path: /tmp/out2/
          if-no-files-found: warn
          retention-days: 7
