name: Verify Open release build from source

# Dispatched by the verification harness.  Goal: determine whether the public
# repository can reproduce the Open.apk published in GitHub Releases.
#
#   * build.yml (the repo's own CI) only runs scripts/build-all.sh, a hand-rolled
#     aapt2+javac+d8 build that shares no pipeline with the released APK.
#   * compose-launcher/ is the only thing in the repo whose build parameters
#     match the released APK (compileSdk 37, versionCode 35, versionName 1.7.5,
#     Compose, R8 -dontobfuscate for Open).  It is undocumented and never
#     exercised by CI.
#
# Attempts, in increasing order of local deviation from the repo as published:
#   A  gradle :app:assembleRelease -PprotectedBuild=false          (verbatim)
#   B  + drop the hardcoded Termux aapt2 override, stub the absent
#      editions/closed/full-backup-src, -PlocalApiIncluded=false
#   C  + generate module/debug.keystore (gitignored, never generated by Gradle)
#   D  C but with localApiIncluded left at its default (true)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (tag v1.7.5.1 is the released source)
        required: false
        default: v1.7.5.1

permissions:
  contents: read

jobs:
  gradle-open:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'v1.7.5.1' }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37 and build tools
        run: |
          set -x
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          # AGP resolves compileSdk 37 as platforms/android-37.
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          ls "$ANDROID_SDK_ROOT/platforms"

      - name: Install Gradle 9.7.1
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-9.7.1/bin" >> "$GITHUB_PATH"

      - name: Repository facts (what the Gradle build expects vs what exists)
        run: |
          set +e
          echo "== checked out ref =="
          git log -1 --format='%H %ad %s' --date=iso
          git describe --tags --always
          echo "== aapt2 override in gradle.properties =="
          grep -n aapt2FromMavenOverride compose-launcher/gradle.properties
          echo "== paths referenced by app/build.gradle.kts =="
          for p in \
            editions/closed/full-backup-src \
            module-universal/protected-payload-src \
            third_party/shi-native/android \
            third_party/shi-v5-v241/android \
            compose-launcher/prepare-protected-inputs.sh \
            compose-launcher/compile-protected-payload.sh \
            compose-launcher/app/proguard-protected-rules.pro \
            .private/closed/release-signing.properties \
            module-universal/assets/rickroll_241.mp4 \
            module-universal/assets/LETTER_TO_DEVELOPERS.txt ; do
            if [ -e "$p" ]; then echo "PRESENT  $p"; else echo "MISSING  $p"; fi
          done

      - name: Attempt A - verbatim Gradle build, Open, only protectedBuild overridden
        continue-on-error: true
        run: |
          cd compose-launcher
          set +e
          gradle :app:assembleRelease -PprotectedBuild=false --no-daemon --stacktrace \
            2>&1 | tee /tmp/attemptA.log | tail -40
          echo "attemptA exit: ${PIPESTATUS[0]}"

      - name: Attempt B - drop Termux aapt2 override, stub absent Closed source dir
        continue-on-error: true
        run: |
          cd compose-launcher
          set +e
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          mkdir -p ../editions/closed/full-backup-src
          gradle :app:assembleRelease \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            --no-daemon --stacktrace \
            2>&1 | tee /tmp/attemptB.log | tail -40
          echo "attemptB exit: ${PIPESTATUS[0]}"

      - name: Attempt C - also generate the gitignored module/debug.keystore
        continue-on-error: true
        run: |
          cd compose-launcher
          set +e
          keytool -genkeypair -keystore ../module/debug.keystore -storepass android \
            -keypass android -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000
          gradle :app:assembleRelease \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            --no-daemon --stacktrace \
            2>&1 | tee /tmp/attemptC.log | tail -60
          echo "attemptC exit: ${PIPESTATUS[0]}"
          find app/build/outputs -name '*.apk' -exec ls -l {} \; || true

      - name: Attempt D - as C but with localApiIncluded at its default (true)
        continue-on-error: true
        run: |
          cd compose-launcher
          set +e
          gradle clean --no-daemon >/dev/null 2>&1 || true
          gradle :app:assembleRelease \
            -PprotectedBuild=false \
            --no-daemon --stacktrace \
            2>&1 | tee /tmp/attemptD.log | tail -60
          echo "attemptD exit: ${PIPESTATUS[0]}"
          find app/build/outputs -name '*.apk' -exec ls -l {} \; || true

      - name: Compare against the official released Open.apk
        if: always()
        continue-on-error: true
        run: |
          set +e
          curl -sSL -o /tmp/official-Open.apk \
            https://github.com/lllucccian/Deekseep/releases/download/v1.7.5.1/Open.apk
          ls -l /tmp/official-Open.apk
          sha256sum /tmp/official-Open.apk
          mkdir -p /tmp/cmp && cd /tmp/cmp
          for apk in $(find "$GITHUB_WORKSPACE/compose-launcher/app/build/outputs" -name '*.apk' 2>/dev/null); do
            name=$(basename "$apk")
            rm -rf x && mkdir x && cd x && unzip -o -q "$apk" classes.dex 2>/dev/null
            dexdump classes.dex 2>/dev/null | grep -E "^  Class descriptor" \
              | sed "s/.*: '//;s/'.*//" | sort > "/tmp/cmp/$name.classes.txt"
            ls -l "/tmp/cmp/$name.classes.txt"
            cd ..
          done
          rm -rf y && mkdir y && cd y && unzip -o -q /tmp/official-Open.apk classes.dex
          dexdump classes.dex 2>/dev/null | grep -E "^  Class descriptor" \
            | sed "s/.*: '//;s/'.*//" | sort > /tmp/cmp/official.classes.txt
          wc -l /tmp/cmp/*.classes.txt
          for f in /tmp/cmp/*.classes.txt; do
            case "$f" in *official*) continue;; esac
            echo "=== $(basename "$f") vs official ==="
            echo "only-in-official: $(comm -23 /tmp/cmp/official.classes.txt "$f" | wc -l)"
            echo "only-in-built:    $(comm -13 /tmp/cmp/official.classes.txt "$f" | wc -l)"
            comm -23 /tmp/cmp/official.classes.txt "$f" | grep '^Lcom/dsmod' | head -20
            echo "---"
            comm -13 /tmp/cmp/official.classes.txt "$f" | grep '^Lcom/dsmod' | head -20
          done

      - name: Collect produced APKs and logs
        if: always()
        run: |
          mkdir -p /tmp/out
          find compose-launcher/app/build/outputs -name '*.apk' -exec cp {} /tmp/out/ \; 2>/dev/null || true
          for a in A B C D; do cp /tmp/attempt$a.log /tmp/out/ 2>/dev/null || true; done
          ls -l /tmp/out || true

      - name: Upload logs and APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-open-verification
          path: /tmp/out/
          if-no-files-found: warn
          retention-days: 7
