name: Build 1.7.4 Fix source edition

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the SDK. android-actions/setup-android is
      # deliberately not used: it still installs the retired "tools" package,
      # which no longer exists in current cmdline-tools and aborts the job.
      - name: Install Android platform and build tools
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SM" ]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0"
          ls "$SDK/build-tools"

      - name: Prepare local debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore module/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build and test source edition
        run: bash scripts/build-all.sh

      - name: Upload APKs and checksums
        uses: actions/upload-artifact@v7
        with:
          name: deekseep-source-edition-v1.7.4-fix
          path: dist/
          if-no-files-found: error
          retention-days: 14
